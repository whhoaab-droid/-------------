    <text x="0" y="20" font-family="'Cairo', 'Tajawal', 'Playfair Display', sans-serif" font-size="21" font-weight="700" fill="#2B2625" letter-spacing="0.5">مسار العمل الحر</text>
    <text x="0" y="38" font-family="'Montserrat', sans-serif" font-size="9" font-weight="600" fill="#C59B7D" letter-spacing="3.5">MASAR LUXURY SALON &amp; SPA</text>
